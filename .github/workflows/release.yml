name: Release Build (Windows & Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.6 or 1.0.6)'
        required: true
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Create Prerelease'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Determine Release Version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            [[ "$RAW_VERSION" == v* ]] && TAG_NAME="$RAW_VERSION" || TAG_NAME="v$RAW_VERSION"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $TAG_NAME"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - run: npm run test:backend
      - name: Install Linux Icon Tooling
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Prepare Linux PNG Icon Set
        if: matrix.os == 'ubuntu-latest'
        run: npm run prepare:linux-icons
      - run: npm run build
      - name: Build Windows NSIS Installer
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish never --config.directories.output=release
      - name: Verify Windows Installer and Update Metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = 'release/AtrisTracker-Setup-${{ steps.release.outputs.version }}.exe'
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path 'release/latest.yml')) { throw 'Missing latest.yml' }
          $blockmaps = Get-ChildItem release -Filter '*.blockmap'
          if ($blockmaps.Count -lt 1) { throw 'Missing NSIS blockmap' }
      - name: Build Linux Packages
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish never --config.directories.output=release
      - name: Verify Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -s "release/AtrisTracker-${{ steps.release.outputs.version }}-x86_64.AppImage"
          test -s "release/AtrisTracker-${{ steps.release.outputs.version }}-amd64.deb"
          test -s release/latest-linux.yml
      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: Release ${{ steps.release.outputs.tag_name }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/telemetry-free-usage-nsis-updater

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:backend
      - run: npm run build

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm version 9.9.9 --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - run: npm run test:backend
      - run: npm run build
      - name: Prepare supported Windows icon
        run: npm run prepare:windows-icon
      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --publish never --config.directories.output=release-smoke
      - name: Verify installer and updater metadata
        shell: pwsh
        run: |
          $installer = 'release-smoke/AtrisTracker-Setup-9.9.9.exe'
          $latest = 'release-smoke/latest.yml'
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path $latest)) { throw "Missing updater metadata: $latest" }
          $blockmaps = Get-ChildItem release-smoke -Filter '*.blockmap'
          if ($blockmaps.Count -lt 1) { throw 'Missing NSIS blockmap' }
          if ((Get-Item $installer).Length -le 0) { throw 'Installer is empty' }
      - name: Smoke test NSIS install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release-smoke/AtrisTracker-Setup-9.9.9.exe').Path
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }

          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $installedExe = Get-ChildItem $programs -Recurse -Filter 'AtrisTracker.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike '*release-smoke*' } |
            Select-Object -First 1
          if (-not $installedExe) { throw "AtrisTracker.exe not found under $programs after install" }
          Write-Host "Installed executable: $($installedExe.FullName)"

          Get-Process AtrisTracker -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Get-ChildItem $installedExe.Directory.FullName -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'NSIS uninstaller was not created' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $installedExe.FullName) { throw 'Installed executable still exists after uninstall' }

  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm version 9.9.9 --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
      - run: npm run prepare:linux-icons
      - run: npm run build
      - run: npx electron-builder --linux AppImage deb --publish never --config.directories.output=release-smoke
      - name: Verify Linux artifacts and updater metadata
        run: |
          test -s release-smoke/AtrisTracker-9.9.9-x86_64.AppImage
          test -s release-smoke/AtrisTracker-9.9.9-amd64.deb
          test -s release-smoke/latest-linux.yml

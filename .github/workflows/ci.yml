name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/reliable-usage-backend

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repository lockfile is currently out of sync with package.json.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Backend smoke test
        run: npm run test:backend

      - name: Build renderer
        run: npm run build

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Simulate release version
        run: npm version 9.9.9 --no-git-tag-version --allow-same-version

      - name: Build renderer
        run: npm run build

      - name: Build Windows installer and portable binary
        run: npx electron-builder --win --publish never --config.directories.output=release-smoke

      - name: Verify Windows artifact names
        shell: pwsh
        run: |
          $installer = 'release-smoke/AtrisTracker-Setup-9.9.9.exe'
          $portable = 'release-smoke/AtrisTracker-Portable-9.9.9.exe'

          if (-not (Test-Path $installer)) {
            throw "Missing installer artifact: $installer"
          }
          if (-not (Test-Path $portable)) {
            throw "Missing portable artifact: $portable"
          }

          Write-Host "Verified $installer"
          Write-Host "Verified $portable"

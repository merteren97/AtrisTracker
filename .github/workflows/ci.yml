name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/reliable-usage-backend

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repository lockfile is currently out of sync with package.json.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Backend smoke test
        run: npm run test:backend

      - name: Build renderer
        run: npm run build

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Mirror the release workflow: change package version before dependency
      # installation, then verify electron-builder uses that exact version.
      - name: Simulate release version
        run: npm version 9.9.9 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Backend smoke test on Windows
        run: npm run test:backend

      - name: Build renderer
        run: npm run build

      - name: Build Windows installer and portable binary
        run: npx electron-builder --win --publish never --config.directories.output=release-smoke

      - name: Verify Windows artifact names
        shell: pwsh
        run: |
          $installer = 'release-smoke/AtrisTracker-Setup-9.9.9.exe'
          $portable = 'release-smoke/AtrisTracker-Portable-9.9.9.exe'

          if (-not (Test-Path $installer)) {
            throw "Missing installer artifact: $installer"
          }
          if (-not (Test-Path $portable)) {
            throw "Missing portable artifact: $portable"
          }

          Write-Host "Verified $installer"
          Write-Host "Verified $portable"

  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Simulate release version
        run: npm version 9.9.9 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Linux icon tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Prepare Linux PNG icon set
        run: npm run prepare:linux-icons

      - name: Build renderer
        run: npm run build

      - name: Build Linux AppImage and Debian package
        run: npx electron-builder --linux --publish never --config.directories.output=release-smoke

      - name: Verify Linux artifacts
        run: |
          APPIMAGE='release-smoke/AtrisTracker-9.9.9-x86_64.AppImage'
          DEB='release-smoke/AtrisTracker-9.9.9-amd64.deb'

          test -s "$APPIMAGE" || { echo "Missing AppImage: $APPIMAGE"; exit 1; }
          test -s "$DEB" || { echo "Missing Debian package: $DEB"; exit 1; }

          echo "Verified $APPIMAGE"
          echo "Verified $DEB"

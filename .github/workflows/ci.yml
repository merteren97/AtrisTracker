name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/reliable-usage-backend

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend smoke test
        run: npm run test:backend

      - name: Build renderer
        run: npm run build
